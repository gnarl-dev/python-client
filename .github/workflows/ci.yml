name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, so a server release that breaks this client is found the morning
  # after it ships rather than by the next pull request that happens to run.
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  # Sent by lucenia/lucenia when rust/api/openapi.yaml changes on main. The
  # server repository is private, so this workflow cannot fetch its
  # description; the server tells it instead. See `spec-freshness`.
  repository_dispatch:
    types: [openapi-updated]

jobs:
  unit:
    name: lint + types + unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. A client is embedded in whatever the
        # caller already runs, so the oldest supported release has to stay
        # green — it is the one nobody tests locally.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: unit, integration and regression
        # Conformance skips here: no node. It has its own job.
        run: pytest -v

  conformance:
    # The layer that matters. Importing proves the types match the
    # description; only this proves the description matches the server.
    #
    # The node comes from the PUBLIC release repository, gnarl-dev/releases —
    # the same binary a user installs — so this needs no secret and runs on
    # every pull request, including one from a fork. (It used to download from
    # lucenia/lucenia, which is internal; with no token configured it never ran
    # at all.)
    name: conformance against a released node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'

      - name: Fetch the latest released node
        env:
          # A public repository: the workflow's own token is enough, and gh
          # wants one even for public reads.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)          triple=x86_64-unknown-linux-gnu ;;
            aarch64|arm64)   triple=aarch64-unknown-linux-gnu ;;
            *) echo "::error::no released node for $(uname -m)"; exit 1 ;;
          esac
          asset="gnarl-${triple}.tar.gz"
          tag=$(gh release view --repo gnarl-dev/releases --json tagName -q .tagName)
          echo "using gnarl-dev/releases $tag ($asset)"
          echo "### Node: gnarl-dev/releases \`$tag\` ($triple)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p node && cd node
          gh release download "$tag" --repo gnarl-dev/releases \
            --pattern "$asset" --pattern SHA256SUMS.txt
          # Checked against the release's own manifest, so a truncated or
          # substituted download fails here rather than as a confusing boot.
          grep " \./${asset}\$\| ${asset}\$" SHA256SUMS.txt | sed 's# \./# #' | sha256sum -c -
          tar xzf "$asset"
          # The released binary is named `gnarl`. It runs JVM-free on the
          # native engine, so no Java is needed.
          test -x gnarl
          echo "LUCENIA_BIN=$PWD/gnarl" >> "$GITHUB_ENV"

      - name: Conformance and doc tests
        # Named explicitly rather than run as a bare `pytest`: if the harness
        # ever fails to find the node it SKIPS, and a green run that skipped
        # everything is worse than a red one. The step after this asserts it
        # actually ran.
        run: pytest tests/conformance -v --junitxml=conformance.xml

      - name: The conformance suite actually ran
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("conformance.xml").getroot().find("testsuite")
          ran = int(suite.get("tests")) - int(suite.get("skipped"))
          print(f"{ran} conformance tests executed")
          if ran < 45:
              sys.exit(
                  f"only {ran} conformance tests executed — the harness found "
                  "no node and skipped, which passes without proving anything"
              )
          PY

  spec-drift:
    # The generated layer must match the description it claims to come from.
    # A hand-edit here is how a client silently stops matching the server.
    name: generated layer is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned exactly, generator AND formatters: an unpinned black reformats
      # the file on the runner and fails a pull request that changed nothing.
      - run: pip install -r requirements-codegen.txt
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          # The same script a developer runs (`make models`), so there is one
          # regeneration command rather than two that drift apart.
          CODEGEN=datamodel-codegen scripts/regen-models.sh
          # Byte for byte: the generator runs with --disable-timestamp, so
          # there is no line that is allowed to differ.
          if ! git diff --exit-code -- src/gnarl/_models.py; then
            echo
            echo "src/gnarl/_models.py does not match src/gnarl/openapi.yaml."
            echo "It is generated — edit the spec and run scripts/regen-models.sh"
            echo "(or \`make models\`)."
            exit 1
          fi

  spec-freshness:
    # The OTHER half of spec-drift. `spec-drift` proves the models match the
    # VENDORED description; this proves the vendored description matches the
    # server's. A client can be perfectly self-consistent and perfectly stale.
    #
    # lucenia/lucenia is private, so this workflow cannot fetch the server's
    # description. Instead the server's CI, on every change to
    # rust/api/openapi.yaml on main, sends:
    #
    #   gh api repos/gnarl-dev/python-client/dispatches \
    #     -f event_type=openapi-updated \
    #     -F client_payload[sha256]=<sha256 of rust/api/openapi.yaml> \
    #     -F client_payload[ref]=<commit>
    #
    # and this job compares that hash with the vendored copy's: a byte-for-byte
    # comparison without the bytes. A mismatch is a red run on main that says
    # which server commit to re-vendor from (`make vendor` beside a lucenia
    # checkout). It runs only for that event, because on any other trigger
    # there is nothing to compare against.
    name: vendored description is current
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the server's description
        env:
          UPSTREAM_SHA256: ${{ github.event.client_payload.sha256 }}
          UPSTREAM_REF: ${{ github.event.client_payload.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${UPSTREAM_SHA256:-}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::dispatch carried no valid client_payload.sha256"
            exit 1
          fi
          ours=$(sha256sum src/gnarl/openapi.yaml | cut -d' ' -f1)
          if [ "$ours" != "$UPSTREAM_SHA256" ]; then
            echo "::error::src/gnarl/openapi.yaml is not the server's current"
            echo "description (lucenia/lucenia@${UPSTREAM_REF:-unknown})."
            echo "Re-vendor it and regenerate: \`make vendor\` beside a lucenia"
            echo "checkout. A stale contract is how a generated client goes on"
            echo "describing an API the server no longer has."
            exit 1
          fi
          echo "vendored description matches lucenia/lucenia@${UPSTREAM_REF:-unknown}"
