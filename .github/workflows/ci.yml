name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: lint + types + unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling. A client is embedded in whatever the
        # caller already runs, so the oldest supported release has to stay
        # green — it is the one nobody tests locally.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy
      - name: unit, integration and regression
        # Conformance skips here: no node. It has its own job.
        run: pytest -v

  can-reach-a-node:
    # `lucenia/lucenia` is an INTERNAL repository, so this workflow's own
    # GITHUB_TOKEN cannot read its releases — an unauthenticated fetch gets a
    # 404, not a 401, which is what made the first run look like a missing
    # asset. Downloading a node needs a token with read access to that repo,
    # stored here as LUCENIA_RELEASE_TOKEN.
    #
    # A secret cannot be read from a job-level `if`, so the check is its own
    # job and the answer becomes an output. The secret's VALUE is never echoed.
    name: node available?
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.LUCENIA_RELEASE_TOKEN }}
        run: |
          if [ -n "${TOKEN:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  conformance:
    # The layer that matters. Importing proves the types match the
    # description; only this proves the description matches the server.
    name: conformance against a real node
    runs-on: ubuntu-latest
    needs: can-reach-a-node
    if: needs.can-reach-a-node.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'

      - name: Fetch a node
        env:
          GH_TOKEN: ${{ secrets.LUCENIA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo lucenia/lucenia --json tagName -q .tagName)
          echo "using $tag"
          gh release download "$tag" --repo lucenia/lucenia \
            --pattern 'lucenia-x86_64-unknown-linux-gnu.tar.gz' --output node.tar.gz
          tar xzf node.tar.gz
          # A node runs JVM-free on the native engine, so no Java is needed.
          echo "LUCENIA_BIN=$PWD/lucenia" >> "$GITHUB_ENV"

      - name: Conformance and doc tests
        # Named explicitly rather than run as a bare `pytest`: if the harness
        # ever fails to find the node it SKIPS, and a green run that skipped
        # everything is worse than a red one. The step after this asserts it
        # actually ran.
        run: pytest tests/conformance -v --junitxml=conformance.xml

      - name: The conformance suite actually ran
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          suite = ET.parse("conformance.xml").getroot().find("testsuite")
          ran = int(suite.get("tests")) - int(suite.get("skipped"))
          print(f"{ran} conformance tests executed")
          if ran < 30:
              sys.exit(
                  f"only {ran} conformance tests executed — the harness found "
                  "no node and skipped, which passes without proving anything"
              )
          PY

  conformance-status:
    # A skipped job shows as a grey tick, and a wall of green ticks where one
    # of them means "did not run" is how a suite stops being read. This job
    # always runs and says, in the summary, whether the layer that matters
    # actually ran.
    name: conformance ran?
    runs-on: ubuntu-latest
    needs: [can-reach-a-node, conformance]
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ needs.can-reach-a-node.outputs.available }}" != "true" ]; then
            {
              echo "### Conformance did NOT run"
              echo
              echo "No \`LUCENIA_RELEASE_TOKEN\` secret, so no node could be"
              echo "downloaded — \`lucenia/lucenia\` is internal and this"
              echo "workflow's own token cannot read it."
              echo
              echo "Everything green above is unit, integration, regression"
              echo "and spec-drift. **None of it talked to a server.**"
              echo
              echo "Set the secret from a real terminal (\`gh secret set\`"
              echo "through a non-interactive shell stores an EMPTY value and"
              echo "still exits 0) with a token that can read that repo's"
              echo "releases."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ needs.conformance.result }}" != "success" ]; then
            echo "conformance: ${{ needs.conformance.result }}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### Conformance ran against a real node" >> "$GITHUB_STEP_SUMMARY"

  spec-drift:
    # The generated layer must match the description it claims to come from.
    # A hand-edit here is how a client silently stops matching the server.
    name: generated layer is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'datamodel-code-generator>=0.82'
      - name: Regenerate and diff
        run: |
          set -euo pipefail
          datamodel-codegen \
            --input src/gnarl/openapi.yaml --input-file-type openapi \
            --output src/gnarl/_models.py --output-model-type pydantic_v2.BaseModel \
            --target-python-version 3.10 --use-standard-collections \
            --use-union-operator --field-constraints --use-schema-description \
            --collapse-root-models --deserialize-default-values enum \
            --use-default-kwarg
          # The timestamp line changes on every run and means nothing.
          if ! git diff --exit-code --ignore-matching-lines='^#   timestamp:' \
               -- src/gnarl/_models.py; then
            echo
            echo "src/gnarl/_models.py does not match src/gnarl/openapi.yaml."
            echo "It is generated — edit the spec and regenerate; see the"
            echo "command in README.md."
            exit 1
          fi

  spec-freshness:
    # The OTHER half of spec-drift, and the half that was missing.
    #
    # `spec-drift` regenerates the models and diffs them against the VENDORED
    # description — so it proves this client is internally consistent and says
    # nothing about whether the vendored copy matches the server's. A client
    # can be perfectly self-consistent and perfectly stale, and this one was:
    # it shipped a description that predated the `SearchProfile` fix the client
    # itself uncovered.
    #
    # Gated on the same token as conformance, because `lucenia/lucenia` is
    # internal.
    name: vendored description is current
    runs-on: ubuntu-latest
    needs: can-reach-a-node
    if: needs.can-reach-a-node.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Diff against the server's description
        env:
          GH_TOKEN: ${{ secrets.LUCENIA_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/lucenia/lucenia/contents/rust/api/openapi.yaml \
            --jq '.content' | base64 -d > /tmp/upstream.yaml
          if ! diff -u /tmp/upstream.yaml src/gnarl/openapi.yaml; then
            echo
            echo "::error::src/gnarl/openapi.yaml is not the server's current"
            echo "description. Re-vendor it and regenerate the models — see the"
            echo "command in README.md. A stale contract is how a generated"
            echo "client goes on describing an API the server no longer has."
            exit 1
          fi
          echo "vendored description matches lucenia/lucenia main"
