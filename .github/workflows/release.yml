# Publishes gnarl-client to PyPI when a v* tag is pushed.
#
# No token lives in this repository: PyPI trusts this workflow by name
# (trusted publishing). The one-time PyPI side: project gnarl-client, owner
# gnarl-dev, repository python-client, workflow release.yml, environment pypi.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag names the version being built
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $have"
            exit 1
          fi
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
