[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnarl"
version = "0.1.0"
description = "Python client for Gnarl, a decentralized search fabric"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lucenia" }]
keywords = ["search", "decentralized", "vector-search", "geospatial", "p2p"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://gnarl.dev"
Source = "https://github.com/gnarl-dev/python-client"
Issues = "https://github.com/gnarl-dev/python-client/issues"
Documentation = "https://gnarl.dev/docs"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  # The regression suite asserts against the vendored description itself, so a
  # re-vendored spec that regresses fails a test rather than a user.
  "pyyaml>=6.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gnarl"]

# The vendored description is shipped, not just used at build time: it is what
# the models were generated from, and a user debugging a response should be
# able to read the contract out of the installed package.
[tool.hatch.build.targets.wheel.force-include]
"src/gnarl/openapi.yaml" = "gnarl/openapi.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  # Conformance runs against a real node and is opt-in: it needs a built
  # `lucenia` binary, so it cannot be part of a bare `pytest` on a laptop that
  # has only checked out this repository.
  "conformance: requires a live node (set GNARL_TEST_NODE or LUCENIA_BIN)",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# `_models.py` is generated; reformatting it would be overwritten on the next
# regeneration and would hide real drift in the diff.
exclude = ["src/gnarl/_models.py"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/gnarl"]

[[tool.mypy.overrides]]
module = "gnarl._models"
ignore_errors = true
